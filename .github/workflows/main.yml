name: msm-Build

on:
  push:
    branches: [master]

jobs:
  build:
    name: Image Build (DEBUG m1882)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install required packages
        run: |
          sudo dpkg --add-architecture i386
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo chmod 644 /etc/apt/keyrings/winehq-archive.key
          sudo wget -O /etc/apt/sources.list.d/winehq-noble.sources https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update
          sudo apt-get install --install-recommends winehq-stable libsdl2-2.0-0 libsdl2-dev build-essential uuid-dev clang llvm iasl nasm gcc-aarch64-linux-gnu abootimg python3-pil python3-git gettext libgcc-s1:i386 libstdc++6:i386 -y
      - name: Build m1882 DEBUG image
      
        run: |
          ./build.sh --device m1882 --debug
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m1882-debug
          path: ./*.img
